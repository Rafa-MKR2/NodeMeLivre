name: Publish Beta to GitHub Packages

on:
  push:
    tags:
      - 'v1.0.0-beta.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@nodemelivre'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Segurança (vetores das 9 rodadas + contrato de contagem)
        # O --expect-checks faz o job falhar se o total de checagens do
        # security:check mudar (regressão de cobertura = publish bloqueado).
        run: npm run security:check -- --expect-checks 70

      - name: Publish to GitHub Packages
        run: |
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            echo "Publishing @nodemelivre/$name..."
            if npm publish "$pkg" --tag beta --access restricted 2>&1 | grep -q "already exists"; then
              echo "  → @nodemelivre/$name já existe, pulando"
            else
              echo "  → @nodemelivre/$name publicado"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}