name: Publish to npm

on:
  push:
    tags:
      - 'v1.0.0-beta.*'   # betas → dist-tag beta
      - 'v1.0.*'          # releases estáveis → dist-tag latest

permissions:
  id-token: write   # OIDC — Trusted Publishing (npm publica sem NPM_TOKEN)
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Geração de SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > /tmp/nodemelivre-sbom.json && test -s /tmp/nodemelivre-sbom.json

      - name: Segurança (vetores das 10 rodadas + contrato de contagem)
        # O --expect-checks faz o job falhar se o total de checagens do
        # security:check mudar (regressão de cobertura = publish bloqueado).
        run: npm run security:check -- --expect-checks 76

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          # Tag beta (v1.0.0-beta.*) → dist-tag beta; tag estável (v1.0.*) → latest
          # Sem NPM_TOKEN: o npm troca o OIDC (id-token) por um token curto.
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            TAG_FLAG="--tag beta"
            echo "Release $GITHUB_REF_NAME → dist-tag beta"
          else
            TAG_FLAG=""
            echo "Release $GITHUB_REF_NAME → dist-tag latest"
          fi
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            echo "Publishing @nodemelivre/$name..."
            # publishConfig já traz registry npmjs + access public (scoped)
            if (cd "$pkg" && npm publish $TAG_FLAG) > /tmp/publish-$name.log 2>&1; then
              echo "  → @nodemelivre/$name publicado"
            elif grep -q "already exists" /tmp/publish-$name.log; then
              echo "  → @nodemelivre/$name já existe, pulando"
            else
              echo "  → @nodemelivre/$name FALHOU (veja o log)"
              tail -3 /tmp/publish-$name.log
              exit 1
            fi
          done
