name: Publish to npm

on:
  push:
    tags:
      - 'v1.0.0-beta.*'   # betas → dist-tag beta
      - 'v1.0.*'          # releases estáveis → dist-tag latest

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Geração de SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx > /tmp/nodemelivre-sbom.json && test -s /tmp/nodemelivre-sbom.json

      - name: Segurança (vetores das 9 rodadas + contrato de contagem)
        # O --expect-checks faz o job falhar se o total de checagens do
        # security:check mudar (regressão de cobertura = publish bloqueado).
        run: npm run security:check -- --expect-checks 76

      - name: Publish to npm
        run: |
          # Tag beta (v1.0.0-beta.*) → dist-tag beta; tag estável (v1.0.*) → latest
          if [[ "$GITHUB_REF_NAME" == *-beta* ]]; then
            TAG_FLAG="--tag beta"
            echo "Release $GITHUB_REF_NAME → dist-tag beta"
          else
            TAG_FLAG=""
            echo "Release $GITHUB_REF_NAME → dist-tag latest"
          fi
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            echo "Publishing @nodemelivre/$name..."
            # publishConfig já traz registry npmjs + access public (scoped)
            if npm publish "$pkg" $TAG_FLAG 2>&1 | grep -q "already exists"; then
              echo "  → @nodemelivre/$name já existe, pulando"
            else
              echo "  → @nodemelivre/$name publicado"
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
