name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, typecheck, teste e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências (npm audit)
        run: npm audit --omit=dev --audit-level=high

      - name: Geração de SBOM (CycloneDX)
        # Falha se o npm sbom não gerar — o BOM passa a ser artefato verificável
        # (transparência de supply chain + entrada para scanners/vuln correlation).
        run: npm sbom --sbom-format=cyclonedx > /tmp/nodemelivre-sbom.json && test -s /tmp/nodemelivre-sbom.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck:all

      - name: Testes
        run: npm run test

      - name: Segurança (vetores das 9 rodadas + contrato de contagem)
        # O --expect-checks faz o job falhar se o total de checagens do
        # security:check mudar (regressão de cobertura = CI vermelho).
        run: npm run security:check -- --expect-checks 76

      - name: Build
        run: npm run build

  conventional-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validar mensagens de commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Sem commit base, ignorando."
            exit 0
          fi
          git log --no-merges --format=%s "$BASE_REF..HEAD" | grep -Ev '^(feat|fix|docs|refactor|test|style|perf|build|ci|chore)(\(.+\))?: ' && {
            echo "::error::Mensagem de commit fora do padrão"
            exit 1
          } || exit 0
