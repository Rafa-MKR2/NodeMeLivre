name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, typecheck, teste e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

  conventional-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar mensagens de commit
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_REF" ]; then
            echo "Sem commit base, ignorando."
            exit 0
          fi
          git log --no-merges --format=%s "$BASE_REF..HEAD" | grep -Ev '^(feat|fix|docs|refactor|test|style|perf|build|ci|chore)(\(.+\))?: ' && {
            echo "::error::Mensagem de commit fora do padrão"
            exit 1
          } || exit 0
